# Agent-mode benchmark: candidates for the herdr-hive worker tiers.
# fast tier candidates and think tier candidates. All run in OpenCode on the Go plan.
# Costs real money when run: uv run bench run --config config.tiers.yaml --model <label>
# Already measured (reports/): glm-5.3-flash 88.0, deepseek-v4.1-flash 56.0, glm-5.3 70.0.

models:
  # fast
  - label: minimax-m3.1-flash
    mode: agent
    harness: opencode
    model: opencode-go/minimax-m3.1-flash

  - label: qwen3.8-flash
    mode: agent
    harness: opencode
    model: opencode-go/qwen3.8-flash

  - label: mimo-v2.6-flash
    mode: agent
    harness: opencode
    model: opencode-go/mimo-v2.6-flash

  # think
  - label: kimi-k3.1-pro-go
    mode: agent
    harness: opencode
    model: opencode-go/kimi-k3.1-pro

  - label: deepseek-v4-pro
    mode: agent
    harness: opencode
    model: opencode-go/deepseek-v4-pro

  - label: mimo-v2.6-pro
    mode: agent
    harness: opencode
    model: opencode-go/mimo-v2.6-pro

  # regular (long context, fast, reliable)
  - label: claude-haiku-5-5-go
    mode: agent
    harness: opencode
    model: opencode-go/claude-haiku-5-5

  - label: gpt-6-luna
    mode: agent
    harness: opencode
    model: opencode-go/gpt-6-luna

judge:
  adapter: claude-code
  model: claude-opus-5-5

runs_per_task: 1
