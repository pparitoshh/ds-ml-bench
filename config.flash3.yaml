# Agent-mode benchmark: fast/cheap tier. Costs real money when run.
models:
  - label: deepseek-v4.1-flash
    mode: agent
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash

  - label: glm-5.3-flash
    mode: agent
    harness: opencode
    model: opencode-go/glm-5.3-flash

  - label: claude-sonnet-5-5
    mode: agent
    harness: claude-code
    model: claude-sonnet-5-5

judge:
  adapter: claude-code
  model: claude-opus-5-5

runs_per_task: 1
