[project]
name = "dsbench"
version = "0.1.0"
description = "Benchmark harness for LLMs on data-science and ML tasks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "openai",
    "anthropic",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "typer",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".cache", "tasks", "scripts"]
markers = [
    "integration: runs bwrap directly; skipped by default",
]
addopts = "-m 'not integration'"
